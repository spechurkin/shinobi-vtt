name: Build and release

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run check
      # Compiled packs are committed; rebuilding their sources requires local PDFs.
      - run: npm run build

      - name: Prepare release manifest
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const file = 'dist/shinobi-vtt/system.json';
          const manifest = JSON.parse(await fs.readFile(file, 'utf8'));
          if (process.env.RELEASE_BUILD === 'true') {
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== manifest.version) {
              throw new Error(`Tag ${tag} must match system.json version ${manifest.version}`);
            }
            const repo = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            manifest.url = repo;
            manifest.manifest = `${repo}/releases/latest/download/system.json`;
            manifest.download = `${repo}/releases/download/${encodeURIComponent(tag)}/shinobi-vtt.zip`;
          }
          const json = JSON.stringify(manifest, null, 2) + '\n';
          await fs.writeFile(file, json);
          await fs.writeFile('dist/system.json', json);
          NODE

      - name: Create installation archive
        working-directory: dist/shinobi-vtt
        run: zip -q -r ../shinobi-vtt.zip .

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: shinobi-vtt
          path: |
            dist/shinobi-vtt.zip
            dist/system.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shinobi-vtt
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/system.json dist/shinobi-vtt.zip \
            --verify-tag --generate-notes --title "$RELEASE_TAG" \
            "${options[@]}"
